<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" fill="none">
  <!-- 圓形 badge（深海藍） -->
  <circle cx="14" cy="14" r="12.5" stroke="#143D5F" stroke-width="1.8"/>
  <!-- 企鵝身體（深海藍燕尾服） -->
  <ellipse cx="14" cy="15.5" rx="6.2" ry="8" fill="#143D5F"/>
  <!-- 白色肚（純淨白） -->
  <ellipse cx="14" cy="16.5" rx="3.6" ry="5.6" fill="#FCFBF8"/>
  <!-- 企鵝頭 -->
  <circle cx="14" cy="8.2" r="3.8" fill="#143D5F"/>
  <!-- 白色臉 -->
  <ellipse cx="14" cy="9" rx="2.1" ry="1.8" fill="#FCFBF8"/>
  <!-- 眼睛 -->
  <circle cx="12.7" cy="8" r="0.5" fill="#143D5F"/>
  <circle cx="15.3" cy="8" r="0.5" fill="#143D5F"/>
  <!-- 喙（珊瑚橘） -->
  <path d="M12.9 9.8 L15.1 9.8 L14 10.9 Z" fill="#F27F63"/>
  <!-- 蛇鷲冠羽（秘書羽毛筆，青綠） -->
  <path d="M14 4.6 C15.4 3.4 17.2 3.2 18.4 3.6 C17.6 4.6 16.2 5.2 14.8 5.2 Z" fill="#5694A7"/>
  <!-- 蝴蝶結 bow tie（珊瑚橘管家） -->
