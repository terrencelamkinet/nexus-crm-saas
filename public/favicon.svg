  <!-- 羽毛筆（青綠，企鵝右側） -->
  <g stroke="#5694A7" stroke-width="1.1" stroke-linecap="round">
    <path d="M20.2 7.2 C21.6 9.4 21.6 11.8 20.4 13.6"/>
    <path d="M20.2 7.2 C21.2 7.8 21.8 8.6 22 9.6"/>
    <path d="M20.4 13.6 L19.6 15.4"/>
